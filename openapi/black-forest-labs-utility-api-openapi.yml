openapi: 3.2.0
info:
  title: BFL Utility API
  description: Authorize with an API key from your user profile.
  version: 0.0.1
servers:
- url: https://api.bfl.ai
  description: BFL API
tags:
- name: Utility
  description: These utility endpoints allow you to check the results of submitted tasks and to manage your finetunes.
paths:
  /v1/finetune_details:
    get:
      tags:
      - Utility
      summary: Finetune Details
      description: Get details about the training parameters and other metadata connected to a specific finetune_id that was created by the user.
      operationId: finetune_details_v1_finetune_details_get
      security:
      - APIKeyHeader: []
      parameters:
      - name: finetune_id
        in: query
        required: true
        schema:
          type: string
          title: Finetune Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinetuneDetailResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      servers:
      - url: https://api.bfl.ai
        description: BFL Finetune API
  /v1/my_finetunes:
    get:
      tags:
      - Utility
      summary: My Finetunes
      description: List all finetune_ids created by the user
      operationId: my_finetunes_v1_my_finetunes_get
      security:
      - APIKeyHeader: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyFinetunesResponse'
      servers:
      - url: https://api.bfl.ai
        description: BFL Finetune API
  /v1/delete_finetune:
    post:
      tags:
      - Utility
      summary: Delete Finetune
      description: Delete a finetune_id that was created by the user
      operationId: delete_finetune_v1_delete_finetune_post
      security:
      - APIKeyHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteFinetuneInputs'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteFinetuneResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      servers:
      - url: https://api.bfl.ai
        description: BFL Finetune API
  /v1/get_result:
    get:
      tags:
      - Utility
      summary: Get Result
      description: An endpoint for getting generation task result.
      operationId: get_result_v1_get_result_get
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
          title: Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/SettledCostResultResponse'
                - $ref: '#/components/schemas/ResultResponse'
                title: Response Get Result V1 Get Result Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    MyFinetunesResponse:
      properties:
        finetunes:
          items: {}
          type: array
          title: Finetunes
          description: List of finetunes created by the user
      type: object
      required:
      - finetunes
      title: MyFinetunesResponse
    FinetuneDetailResponse:
      properties:
        finetune_details:
          additionalProperties: true
          type: object
          title: Finetune Details
          description: Details about the parameters used for finetuning
      type: object
      required:
      - finetune_details
      title: FinetuneDetailResponse
    DeleteFinetuneResponse:
      properties:
        status:
          type: string
          title: Status
          description: Status of the deletion
        message:
          type: string
          title: Message
          description: Message about the deletion
        deleted_finetune_id:
          type: string
          title: Deleted Finetune Id
          description: ID of the deleted finetune
        timestamp:
          type: string
          title: Timestamp
          description: Timestamp of the deletion
      type: object
      required:
      - status
      - message
      - deleted_finetune_id
      - timestamp
      title: DeleteFinetuneResponse
    ResultResponse:
      properties:
        id:
          type: string
          title: Id
          description: Task id for retrieving result
        status:
          $ref: '#/components/schemas/StatusResponse'
        result:
          anyOf:
          - {}
          - type: 'null'
          title: Result
        progress:
          anyOf:
          - type: number
          - type: 'null'
          title: Progress
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        preview:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Preview
      type: object
      required:
      - id
      - status
      title: ResultResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    DeleteFinetuneInputs:
      properties:
        finetune_id:
          type: string
          title: Finetune Id
          description: Name of the LoRA to delete.
          example: my-finetune
      type: object
      required:
      - finetune_id
      title: DeleteFinetuneInputs
    StatusResponse:
      type: string
      enum:
      - Task not found
      - Pending
      - Reasoning
      - Generating
      - Request Moderated
      - Content Moderated
      - No Card Generated
      - Ready
      - Error
      title: StatusResponse
    SettledCostResultResponse:
      properties:
        id:
          type: string
          title: Id
          description: Task id for retrieving result
        status:
          $ref: '#/components/schemas/StatusResponse'
        result:
          anyOf:
          - {}
          - type: 'null'
          title: Result
        progress:
          anyOf:
          - type: number
          - type: 'null'
          title: Progress
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
        preview:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Preview
        cost:
          type: number
          title: Cost
          description: Settled cost in credits for this request
      type: object
      required:
      - id
      - status
      - cost
      title: SettledCostResultResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      in: header
      name: x-key
x-provenance:
  method: harvested
  publisher: Black Forest Labs
  source: https://api.bfl.ai/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
